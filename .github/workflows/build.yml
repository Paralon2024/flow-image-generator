name: Build Chrome Extension

on:
  push:
    branches:
      - main
      - "fix/**"
      - "ci/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Type-check, build, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Build Chrome extension
        run: npm run build

      - name: Package Chrome extension
        run: npm run zip

      - name: Upload Chrome extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: flow-image-generator-chrome
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 14
